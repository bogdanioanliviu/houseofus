---
- hosts: proxmox
  become: true
  vars:
    telegram_token: "{{ vault_telegram_token }}"
    telegram_chat_id: "{{ vault_telegram_chat_id }}"
    force_apt_get: yes
    cache_valid_time: 3600

  tasks:
    - name: Update apt repo and cache
      apt:
        update_cache: yes
        force_apt_get: "{{ force_apt_get }}"
        cache_valid_time: "{{ cache_valid_time }}"

    - name: Upgrade all packages
      apt:
        upgrade: dist
        force_apt_get: "{{ force_apt_get }}"

    - name: Check if a reboot is needed
      register: reboot_required_file
      stat:
        path: /var/run/reboot-required

    - name: Remove dependencies and clean cache
      apt:
        autoremove: yes
        autoclean: yes
        force_apt_get: "{{ force_apt_get }}"

    - name: Notify reboot required
      telegram:
        token: '{{ telegram_token }}'
        api_args:
          chat_id: '{{ telegram_chat_id }}'
          parse_mode: "markdown"
          text: "⚠️ Trebuie restartat {{ inventory_hostname }}"
          disable_web_page_preview: true
      when: reboot_required_file.stat.exists

    - name: Notify update failure
      telegram:
        token: '{{ telegram_token }}'
        api_args:
          chat_id: '{{ telegram_chat_id }}'
          parse_mode: "markdown"
          text: "❌ Update FAILED on {{ inventory_hostname }}"
      rescue:
        - name: Notify failure
          telegram:
            token: '{{ telegram_token }}'
            api_args:
              chat_id: '{{ telegram_chat_id }}'
              parse_mode: "markdown"
              text: "❌ Update FAILED on {{ inventory_hostname }}"
